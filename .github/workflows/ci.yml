name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  mcp-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q mcp tests
      - run: python tests/mcp_contract_test.py
  native-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          modules: qtconnectivity
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - run: cmake -S native -B native/build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build native/build --parallel

